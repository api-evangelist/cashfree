        order_currency: INR
        order_expiry_time: '2023-09-09T18:02:46+05:30'
        order_id: order_3242Tq4Edj9CC5RDcMeobmJOWOBJij
        order_meta:
          return_url: https://www.cashfree.com/devstudio/thankyou
          payment_methods: cc
          notify_url: https://example.com/cf_notify
        order_note: some order note LIST
        order_splits: []
        order_status: ACTIVE
        order_tags:
          name: John
          age: '19'
        terminal_data: null
        cart_details:
          cart_id: '1'
  x-elicitationConfig:
    createPaymentLink:
      enabled: true
      fields:
        link_amount:
          required: true
          message: Please provide the amount to be collected through this payment link
          schema:
            type: number
            title: Link Amount
            description: Amount to be collected using this link (minimum 1 INR)
            minimum: 1
          mapping:
            target: body.link_amount
            transform: number
        customer_phone:
          required: true
          message: Please provide the customer's phone number
          schema:
            type: string
            title: Customer Phone
            description: Phone number of the customer in international format without '+' sign
            pattern: ^[1-9][0-9]{7,14}$
          mapping:
            target: body.customer_details.customer_phone
            transform: string
  securitySchemes:
    XClientID:
      type: apiKey
      in: header
      name: x-client-id
      description: Client app ID. You can find your app id in the [merchant dashboard](https://merchant.cashfree.com/merchants/pg/developers/api-keys?env=prod").
    XClientSecret:
      type: apiKey
      in: header
      name: x-client-secret
      description: Client secret key. You can find your secret in the [merchant dashboard](https://merchant.cashfree.com/merchants/pg/developers/api-keys?env=prod").
    XClientSignatureHeader:
      type: apiKey
      in: header
      name: x-client-signature
      description: Use this if you do not want to pass the secret key and instead want to use the signature.
    XPartnerAPIKey:
      type: apiKey
      in: header
      name: x-partner-apikey
      description: If you are partner and you are making an api call on behalf of a merchant
    XPartnerMerchantID:
      type: apiKey
      in: header
      name: x-partner-merchantid
      description: If you are partner use this to specify the merchant id if you don't have the merchant client app id
