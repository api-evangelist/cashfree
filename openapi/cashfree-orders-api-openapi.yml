          description: Original price
        item_discounted_unit_price:
          type: number
          format: double
          description: Discounted Price
        item_currency:
          type: string
          description: Currency of the item.
        item_quantity:
          type: number
          format: int32
          description: Quantity if that item
    OfferNB:
